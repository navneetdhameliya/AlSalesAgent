# Render Blueprint. Secrets are NOT stored here: every `sync: false` value is typed into the Render dashboard.
# One web service runs the API and the follow-up/report scheduler. Use a paid plan: a free service sleeps and the scheduler stops.
services:
  - type: web
    name: ai-sales-executive-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      # Generated by Render once, then readable only in the dashboard
      - key: WIDGET_SESSION_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SIGNING_KEY
        generateValue: true
      - key: LEAD_WEBHOOK_API_KEY
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      # You provide these in the dashboard
      - key: DATABASE_URL            # Supabase connection string (pooler, Singapore)
        sync: false
      - key: SUPABASE_JWT_SECRET     # OPTIONAL: only if the project still signs with the legacy HS256 secret
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: API_BASE_URL            # this service's public URL, e.g. https://ai-sales-executive-api.onrender.com
        sync: false
      - key: DASHBOARD_URL           # the Vercel URL
        sync: false
      - key: CORS_ORIGINS            # same as DASHBOARD_URL
        sync: false
